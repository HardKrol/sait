			<button class="chap_button" onclick="location.href='./heli.html'">Виртуальный полёт</button>
			<button class="chap_button" onclick="location.href='./herit.html'">Подвиг</button>
			<button class="chap_button" onclick="location.href='./rewards.html'">Награды</button>
			<button class="chap_button" onclick="location.href='./feat.html'">Полётный планшет</button>
			<button class="chap_button" onclick="location.href='./author.html'">Об авторе</button>

		<div class="image-gallery">
			<figure class="image_container">
				<img src="./images/heli/map1.jpg" alt="Карта маршрута 1" />

			<figure class="image_container">
				<img src="./images/heli/map2.jpg" alt="Карта маршрута 2" />

			<figure class="image_container">
				<img src="./images/heli/map3.jpg" alt="Карта маршрута 3" />
			</figure>
			<figure class="image_container">
				<img src="./images/heli/map4.jpg" alt="Карта маршрута 4" />
			</figure>
		</div>

		<div class="page-navigation">
			<button class="nav-button" onclick="location.href='./photo.html'">← Назад</button>
			<button class="nav-button" onclick="location.href='./herit.html'">Далее →</button>
		</div>
	</div>

	<img id="heli-cursor" src="./images/heli/heli.png" alt="Курсор вертолёта" />

	<div class="site-footer">
		<p><a href="./author.html">Об авторе сайта</a></p>

	<!-- Лайтбокс для карусели -->
	<div id="lightbox" class="lightbox">
		<div class="lightbox-content">
			<div class="lightbox-header">
				<div class="lightbox-counter">
					<span id="image-counter">1 / 1</span>
				</div>
				<div class="lightbox-tools">
					<button class="lightbox-tool-btn" onclick="zoomIn()" title="Приблизить">🔍</button>
				</div>
			</div>

			<div class="lightbox-image-wrapper">
				<button class="lightbox-nav prev" id="prev-btn" onclick="prevImage()" title="Предыдущее">‹</button>
				<img id="lightbox-image" class="lightbox-image" src="" alt="Увеличенное изображение">
				<button class="lightbox-nav next" id="next-btn" onclick="nextImage()" title="Следующее">›</button>
			</div>

			<div class="lightbox-thumbnails" id="thumbnails-container"></div>

			<button class="lightbox-close" onclick="closeLightbox()">✕</button>
		</div>
	</div>

	<script>
		let currentLightboxImages = [];
		let currentImageIndex = 0;
		let currentZoom = 1;

		function openLightbox(clickedImg) {
			// Собрать все изображения из галереи
			let container = clickedImg.closest('.image-gallery');

			if (container) {
				let images = Array.from(container.querySelectorAll('img'));
				currentLightboxImages = images.map(img => img.src);
				currentImageIndex = images.indexOf(clickedImg);
			} else {
				currentLightboxImages = [clickedImg.src];
				currentImageIndex = 0;
			}

			currentZoom = 1;
			showLightboxImage();
			renderThumbnails();
			document.getElementById('lightbox').classList.add('active');
			document.body.style.overflow = 'hidden';
		}

		function closeLightbox() {
			document.getElementById('lightbox').classList.remove('active');
			document.body.style.overflow = 'auto';
		}

		function renderThumbnails() {
			const container = document.getElementById('thumbnails-container');
			container.innerHTML = '';

			currentLightboxImages.forEach((src, index) => {
				const thumb = document.createElement('div');
				thumb.className = 'lightbox-thumbnail' + (index === currentImageIndex ? ' active' : '');
				thumb.style.backgroundImage = `url('${src}')`;
				thumb.onclick = () => goToImage(index);
				container.appendChild(thumb);
			});
		}

		function goToImage(index) {
			currentImageIndex = index;
			currentZoom = 1;
			showLightboxImage();
			renderThumbnails();
		}

		function showLightboxImage() {
			const img = document.getElementById('lightbox-image');
			img.src = currentLightboxImages[currentImageIndex];
			img.style.transform = `scale(${currentZoom})`;

			document.getElementById('image-counter').textContent =
				(currentImageIndex + 1) + ' / ' + currentLightboxImages.length;

			document.getElementById('prev-btn').disabled = currentImageIndex === 0;
			document.getElementById('next-btn').disabled = currentImageIndex === currentLightboxImages.length - 1;
		}

		function nextImage() {
			if (currentImageIndex < currentLightboxImages.length - 1) {
				goToImage(currentImageIndex + 1);
			}
		}

		function prevImage() {
			if (currentImageIndex > 0) {
				goToImage(currentImageIndex - 1);
			}
		}

		function zoomIn() {
			if (currentZoom < 3) {
				currentZoom += 0.5;
				document.getElementById('lightbox-image').style.transform = `scale(${currentZoom})`;
			}
		}

		function zoomOut() {
			if (currentZoom > 1) {
				currentZoom -= 0.5;
				if (currentZoom < 1) currentZoom = 1;
				document.getElementById('lightbox-image').style.transform = `scale(${currentZoom})`;
			}
		}

		const heliCursor = document.getElementById('heli-cursor');
		const images = document.querySelectorAll('.image-gallery img');

		images.forEach(img => {
			img.style.cursor = 'pointer';

			img.addEventListener('mouseenter', () => {
				heliCursor.style.display = 'block';
			});

			img.addEventListener('mouseleave', () => {
				heliCursor.style.display = 'none';
			});

			img.addEventListener('click', function(e) {
				e.preventDefault();
				e.stopPropagation();
				openLightbox(this);
			});
		});

		document.addEventListener('mousemove', (event) => {
			if (heliCursor.style.display === 'block') {
				heliCursor.style.left = event.clientX + 'px';
				heliCursor.style.top = event.clientY + 'px';
			}
		});

		// Закрывать лайтбокс при клике на фон
		document.getElementById('lightbox').addEventListener('click', function(e) {
			if (e.target === this) {
				closeLightbox();
			}
		});

		// Закрывать при нажатии на Escape
		document.addEventListener('keydown', function(e) {
			if (e.key === 'Escape') {
				closeLightbox();
			}
		});

		// Навигация со стрелками
		document.addEventListener('keydown', function(e) {
			if (!document.getElementById('lightbox').classList.contains('active')) return;
			if (e.key === 'ArrowRight') nextImage();
			if (e.key === 'ArrowLeft') prevImage();
			if (e.key === '+' || e.key === '=') zoomIn();
			if (e.key === '-') zoomOut();
		});

		function toggleMenu() {
			const menu = document.getElementById('menu');
			menu.classList.toggle('hidden');
		}

		function setActiveMenuButton() {
			const currentPage = window.location.pathname.split('/').pop() || 'index.html';
			const buttons = document.querySelectorAll('.chap_button');
			
			buttons.forEach(button => {
				button.classList.remove('active');
				const href = button.getAttribute('onclick').match(/['"](.*?)['"]/);
				if (href && href[1]) {
					const pageName = href[1].split('/').pop();
					if (pageName === currentPage || (currentPage === '' && pageName === 'index.html')) {
						button.classList.add('active');
					}
				}
			});
		}

		function closeMenuOnClick() {
			if (window.innerWidth <= 768) {
				const menu = document.getElementById('menu');
				menu.classList.add('hidden');
			}
		}

		document.querySelectorAll('.chap_button').forEach(button => {
			button.addEventListener('click', closeMenuOnClick);
		});

		setActiveMenuButton();

		// ===== ФУНКЦИЯ ПОЯВЛЕНИЯ И ИСЧЕЗНОВЕНИЯ БЛОКОВ ПРИ СКРОЛЛЕ =====
		function revealOnScroll() {
			const blocks = document.querySelectorAll('.fade-block');
			
			blocks.forEach(block => {
				const blockPosition = block.getBoundingClientRect();
				const windowHeight = window.innerHeight;
				const threshold = 100; // пиксели, на которые нужно прокрутить блок
				
				// Если блок попадает в видимую область (с отступом вверх)
				if (blockPosition.top < windowHeight - threshold && blockPosition.bottom > 0) {
					block.classList.add('visible');
					block.classList.remove('hidden');
				} else if (blockPosition.bottom < 0) {
					// Блок вышел вверх - исчезает с трансформацией вверх
					block.classList.add('hidden');
					block.classList.remove('visible');
				} else {
					// Блок внизу - исчезает с трансформацией вниз
					block.classList.remove('visible');
					block.classList.remove('hidden');
				}
			});
		}

		// Запуск функции при загрузке страницы
		window.addEventListener('load', revealOnScroll);

		// Запуск функции при скролле
		window.addEventListener('load', revealOnScroll);

		document.addEventListener('DOMContentLoaded', () => {
			const blocks = document.querySelectorAll('.fade-block');

			const observerOptions = {
				threshold: 0.15, // Блок считается видимым, когда показано 15% его площади
				rootMargin: '0px 0px -50px 0px' // Срабатывает чуть раньше, чем блок коснется края
			};

			const observer = new IntersectionObserver((entries) => {
				entries.forEach(entry => {
					if (entry.isIntersecting) {
						entry.target.classList.add('visible');
						entry.target.classList.remove('hidden');
					} else {
						// Если нужно, чтобы блоки снова исчезали, когда уходят вниз
						if (entry.boundingClientRect.top > 0) {
							entry.target.classList.remove('visible');
						} else {
							// Если блок ушел вверх, добавляем класс hidden для эффекта ухода вверх
							entry.target.classList.add('hidden');
						}
					}
				});
			}, observerOptions);

			blocks.forEach(block => observer.observe(block));
		});
	</script>
</body>

</html>
